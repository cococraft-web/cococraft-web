<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <!-- Coconut Brown Gradients -->
    <linearGradient id="cocoShellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3A1C" />
      <stop offset="50%" stop-color="#4A250F" />
      <stop offset="100%" stop-color="#2D1407" />
    </linearGradient>
    <linearGradient id="cocoInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B57F" />
      <stop offset="60%" stop-color="#C9A66B" />
      <stop offset="100%" stop-color="#9E763B" />
    </linearGradient>

    <!-- Natural Green Gradients -->
    <linearGradient id="leafGradPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075B2A" />
      <stop offset="60%" stop-color="#16833A" />
      <stop offset="100%" stop-color="#28A745" />
    </linearGradient>
    <linearGradient id="leafGradSecondary" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#054520" />
      <stop offset="70%" stop-color="#16833A" />
      <stop offset="100%" stop-color="#3CD070" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1C211D" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(10, 8)" filter="url(#logoShadow)">
    <!-- Outer Coconut Half-Shell Silhouette -->
    <path d="M 32 60 C 14 60 2 46 2 28 C 2 19 6 12 12 6 C 14 16 20 25 32 28 C 44 25 50 16 52 6 C 58 12 62 19 62 28 C 62 46 50 60 32 60 Z" 
          fill="url(#cocoShellGrad)" />
    
    <!-- Inner Organic Fibre Rim -->
    <path d="M 32 54 C 18 54 8 43 8 29 C 13 32 20 34 32 34 C 44 34 51 32 56 29 C 56 43 46 54 32 54 Z" 
          fill="url(#cocoInnerGrad)" opacity="0.9" />

    <!-- Core Husk Organic Texture Accents -->
    <ellipse cx="32" cy="42" rx="15" ry="7" fill="#4A250F" opacity="0.3" />

    <!-- Left Sprouting Palm Leaf (Dimensional curves) -->
    <path d="M 32 30 C 26 20 16 14 6 15 C 5 21 10 28 22 30 C 26 31 30 31 32 30 Z" 
          fill="url(#leafGradSecondary)" />
    
    <!-- Primary Ascending Shoot Leaf -->
    <path d="M 32 32 C 30 18 35 4 48 0 C 49 8 46 20 36 28 C 34 29 33 31 32 32 Z" 
          fill="url(#leafGradPrimary)" />

    <!-- Right Accent Blade -->
    <path d="M 32 31 C 38 23 48 18 58 19 C 57 25 51 30 40 31 C 36 32 33 31 32 31 Z" 
          fill="url(#leafGradSecondary)" opacity="0.95" />

    <!-- Central Leaf Spine Highlight -->
    <path d="M 32 32 Q 36 18 48 0" stroke="#75E59B" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(86, 0)">
    <!-- "COCO CRAFT" -->
    <text x="0" y="40" 
          font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="25" 
          font-weight="800" 
          letter-spacing="0.06em" 
          fill="#1C211D">
      COCO <tspan fill="#4A250F">CRAFT</tspan>
    </text>

    <!-- Gold Accent Line Separator -->
    <rect x="0" y="47" width="220" height="2" fill="#C9A66B" opacity="0.6" rx="1" />

    <!-- "EXPORTS" Subtitle with deliberate tracking -->
    <text x="1" y="62" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="11.5" 
          font-weight="700" 
          letter-spacing="0.44em" 
          fill="#16833A">
      EXPORTS
    </text>
  </g>
</svg>
